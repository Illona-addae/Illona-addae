<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Illona Addae</title>
  <desc id="d">Software Engineer at AmaliTech. Building production web apps with TypeScript, React and Next.js.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#112a4a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9cc9ef"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
    <clipPath id="c0"><rect x="118" y="196" height="40" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" keyTimes="0;0.09;0.2;0.24;1" values="0;418;418;0;0"/></rect></clipPath>
    <clipPath id="c1"><rect x="118" y="196" height="40" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" keyTimes="0;0.25;0.34;0.45;0.49;1" values="0;0;404;404;0;0"/></rect></clipPath>
    <clipPath id="c2"><rect x="118" y="196" height="40" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" keyTimes="0;0.5;0.59;0.7;0.74;1" values="0;0;404;404;0;0"/></rect></clipPath>
    <clipPath id="c3"><rect x="118" y="196" height="40" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" keyTimes="0;0.75;0.84;0.95;0.99;1" values="0;0;461;461;0;0"/></rect></clipPath>
  </defs>

  <style>
    .blob { transform-box: fill-box; transform-origin: center; }
    .b1 { animation: drift1 14s ease-in-out infinite alternate; }
    .b2 { animation: drift2 18s ease-in-out infinite alternate; }
    .b3 { animation: drift3 22s ease-in-out infinite alternate; }
    .float { animation: float 6s ease-in-out infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
    .caret { animation: blink 1s steps(1) infinite; }
    .rise { opacity: 0; animation: rise 0.9s ease-out forwards; }
    .rise2 { animation-delay: 0.15s; }
    .rise3 { animation-delay: 0.3s; }
    @keyframes drift1 { to { transform: translate(140px, 40px) scale(1.15); } }
    @keyframes drift2 { to { transform: translate(-160px, -30px) scale(0.9); } }
    @keyframes drift3 { to { transform: translate(80px, -50px) scale(1.2); } }
    @keyframes float { 50% { transform: translateY(-10px); } }
    @keyframes pulse { 0% { opacity: 0.7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .b1, .b2, .b3, .float, .pulse, .caret { animation: none; }
      .rise { animation: none; opacity: 1; }
    }
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="blob b1" cx="260" cy="60" r="150" fill="#2f6f9f" opacity="0.55"/>
      <circle class="blob b2" cx="980" cy="260" r="170" fill="#3b82f6" opacity="0.35"/>
      <circle class="blob b3" cx="760" cy="40" r="120" fill="#14b8a6" opacity="0.25"/>
    </g>
    <rect width="1200" height="320" fill="url(#dots)" opacity="0.06"/>

    <!-- status pill -->
    <g class="rise">
      <rect x="80" y="44" width="292" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
      <circle class="pulse" cx="102" cy="61" r="5" fill="#34d399"/>
      <circle cx="102" cy="61" r="5" fill="#34d399"/>
      <text x="118" y="66" class="sans" font-size="15" fill="#d6e6f5" letter-spacing="0.3">Software Engineer · AmaliTech</text>
    </g>

    <!-- name -->
    <text x="76" y="158" class="sans rise rise2" font-size="68" font-weight="700" fill="url(#name)" letter-spacing="-1">Illona Addae</text>

    <!-- typed roles -->
    <g class="rise rise3">
      <text x="80" y="224" class="mono" font-size="24" fill="#5eead4">❯</text>
      <g clip-path="url(#c0)"><text x="118" y="224" class="mono" font-size="24" fill="#e6f0fa" textLength="418" lengthAdjust="spacingAndGlyphs">Software Engineer @ AmaliTech</text></g>
      <g clip-path="url(#c1)"><text x="118" y="224" class="mono" font-size="24" fill="#e6f0fa" textLength="404" lengthAdjust="spacingAndGlyphs">Building production web apps</text></g>
      <g clip-path="url(#c2)"><text x="118" y="224" class="mono" font-size="24" fill="#e6f0fa" textLength="404" lengthAdjust="spacingAndGlyphs">TypeScript · React · Next.js</text></g>
      <g clip-path="url(#c3)"><text x="118" y="224" class="mono" font-size="24" fill="#e6f0fa" textLength="461" lengthAdjust="spacingAndGlyphs">Contracts first, tests alongside</text></g>
      <rect class="caret" x="120" y="203" width="12" height="26" rx="2" fill="#5eead4">
        <animate attributeName="x" dur="16s" repeatCount="indefinite"
          keyTimes="0;0.09;0.2;0.24;0.25;0.34;0.45;0.49;0.5;0.59;0.7;0.74;0.75;0.84;0.95;0.99;1"
          values="120;542;542;120;120;526;526;120;120;526;526;120;120;583;583;120;120"/>
      </rect>
    </g>

    <!-- code glyph -->
    <g class="float" transform="translate(0 0)">
      <g transform="translate(900 92)" opacity="0.9">
        <rect width="220" height="150" rx="16" fill="#0b1426" fill-opacity="0.75" stroke="#9cc9ef" stroke-opacity="0.25"/>
        <circle cx="22" cy="22" r="5" fill="#f87171"/>
        <circle cx="40" cy="22" r="5" fill="#fbbf24"/>
        <circle cx="58" cy="22" r="5" fill="#34d399"/>
        <text x="22" y="66" class="mono" font-size="15" fill="#93c5fd">const</text>
        <text x="72" y="66" class="mono" font-size="15" fill="#e6f0fa">ship</text>
        <text x="120" y="66" class="mono" font-size="15" fill="#9cc9ef">=</text>
        <text x="22" y="92" class="mono" font-size="15" fill="#5eead4">  typed</text>
        <text x="90" y="92" class="mono" font-size="15" fill="#9cc9ef">&amp;&amp;</text>
        <text x="22" y="118" class="mono" font-size="15" fill="#5eead4">  tested</text>
        <text x="100" y="118" class="mono" font-size="15" fill="#9cc9ef">;</text>
      </g>
    </g>
  </g>
</svg>
